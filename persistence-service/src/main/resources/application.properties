quarkus.application.name=persistence-service
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.http.limits.max-body-size=50M

quarkus.datasource.db-kind=postgresql
# Production (Kubernetes) connection; dev and test use Quarkus Dev Services (Testcontainers PostgreSQL).
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/aggbench}
%prod.quarkus.datasource.username=${DB_USER:aggbench}
%prod.quarkus.datasource.password=${DB_PASSWORD:aggbench}
quarkus.datasource.jdbc.max-size=${DB_POOL_SIZE:24}
quarkus.datasource.jdbc.min-size=4
quarkus.datasource.devservices.image-name=postgres:17.6-alpine
quarkus.flyway.migrate-at-start=true

# Worker threads for the blocking JDBC endpoints.
quarkus.thread-pool.max-threads=${WORKER_THREADS:64}

persistence.faults.latency-ms=${PERSISTENCE_LATENCY_MS:0}
persistence.faults.latency-jitter-ms=${PERSISTENCE_LATENCY_JITTER_MS:0}
persistence.faults.error-before-rate=${PERSISTENCE_ERROR_BEFORE_RATE:0}
persistence.faults.error-after-commit-rate=${PERSISTENCE_ERROR_AFTER_COMMIT_RATE:0}
