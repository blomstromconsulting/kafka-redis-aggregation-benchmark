quarkus.application.name=ml-simulator
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# Inference profile (see InferenceProfile). Change at runtime with POST /admin/profile.
ml.profile=${ML_PROFILE:fixed}
ml.latency-ms=${ML_LATENCY_MS:50}
ml.stddev-ms=${ML_STDDEV_MS:10}
ml.tail-probability=${ML_TAIL_PROBABILITY:0}
ml.tail-latency-ms=${ML_TAIL_LATENCY_MS:0}
ml.error-rate=${ML_ERROR_RATE:0}
ml.timeout-rate=${ML_TIMEOUT_RATE:0}
ml.timeout-latency-ms=${ML_TIMEOUT_LATENCY_MS:5000}
ml.max-concurrency=${ML_MAX_CONCURRENCY:256}
ml.max-queue=${ML_MAX_QUEUE:10000}
