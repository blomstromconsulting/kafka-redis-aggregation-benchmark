quarkus.application.name=load-generator
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics

gen.run-id=${RUN_ID:local}
gen.variant=${VARIANT:a1}
gen.scenario=${SCENARIO:smoke}
gen.repetition=${REPETITION:1}
gen.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
gen.ingress-topic=${INGRESS_TOPIC:aggbench.local.ingress}
gen.partitions=${PARTITIONS:12}
gen.jdbc-url=${DB_URL:jdbc:postgresql://localhost:5432/aggbench}
gen.jdbc-user=${DB_USER:aggbench}
gen.jdbc-password=${DB_PASSWORD:aggbench}
gen.lag-groups=${LAG_GROUPS:aggbench-a1-local:aggbench.local.ingress}

gen.seed=${SEED:42}
gen.event-rate=${EVENT_RATE:100}
gen.warmup-seconds=${WARMUP_SECONDS:30}
gen.ramp-seconds=${RAMP_SECONDS:15}
gen.duration-seconds=${DURATION_SECONDS:60}
gen.payload-size-a=${PAYLOAD_A:200}
gen.payload-size-b=${PAYLOAD_B:200}
gen.payload-size-c=${PAYLOAD_C:400}
gen.correlation-window-ms=${CORRELATION_WINDOW_MS:1000}
gen.window-distribution=${WINDOW_DISTRIBUTION:uniform}
gen.out-of-order-percent=${OUT_OF_ORDER_PERCENT:10}
gen.duplicate-percent=${DUPLICATE_PERCENT:2}
gen.duplicate-delay-max-ms=${DUPLICATE_DELAY_MAX_MS:2000}
gen.missing-percent=${MISSING_PERCENT:1}
gen.stale-percent=${STALE_PERCENT:0}
gen.inference-percent=${INFERENCE_PERCENT:100}
gen.hot-partition-fraction=${HOT_PARTITION_FRACTION:0}
gen.hot-traffic-fraction=${HOT_TRAFFIC_FRACTION:0}
gen.drain-timeout-seconds=${DRAIN_TIMEOUT_SECONDS:600}
