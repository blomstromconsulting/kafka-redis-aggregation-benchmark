# Kafka 4.2 in KRaft combined mode (each pod is broker + controller). Persistent storage is allowed for Kafka.
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  labels: {{- include "aggbench.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- include "aggbench.labels" . | nindent 4 }}
spec:
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: {{- include "aggbench.labels" . | nindent 4 }}
spec:
  serviceName: kafka-headless
  replicas: {{ .Values.kafka.brokers }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          command: ["bash", "-c"]
          args:
            - |
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${HOSTNAME}.kafka-headless.{{ .Release.Namespace }}.svc.cluster.local:9092
              exec /__cacert_entrypoint.sh /etc/kafka/docker/run
          ports:
            - {name: client, containerPort: 9092}
            - {name: controller, containerPort: 9093}
          env:
            - {name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }}}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: {{ include "aggbench.kafkaVoters" . | quote }}}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT"}
            - {name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data"}
            - {name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }}}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_DEFAULT_REPLICATION_FACTOR, value: {{ .Values.kafka.replicationFactor | quote }}}
            - {name: KAFKA_MIN_INSYNC_REPLICAS, value: {{ .Values.kafka.minInsyncReplicas | quote }}}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: {{ .Values.kafka.replicationFactor | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: {{ .Values.kafka.replicationFactor | quote }}}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: {{ .Values.kafka.minInsyncReplicas | quote }}}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: {{ .Values.kafka.replicationFactor | quote }}}
            - {name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: {{ .Values.kafka.minInsyncReplicas | quote }}}
            # All three group protocols enabled; none is a fallback for another (the apps verify the group type).
            - {name: KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS, value: "classic,consumer,streams"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_GROUP_MIN_SESSION_TIMEOUT_MS, value: "6000"}
            - {name: KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS, value: {{ .Values.kafka.groupSessionTimeoutMs | quote }}}
            - {name: KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS, value: "6000"}
            - {name: KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS, value: {{ .Values.kafka.groupHeartbeatIntervalMs | quote }}}
            - {name: KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS, value: {{ .Values.kafka.groupHeartbeatIntervalMs | quote }}}
            - {name: KAFKA_GROUP_STREAMS_SESSION_TIMEOUT_MS, value: {{ .Values.kafka.groupSessionTimeoutMs | quote }}}
            - {name: KAFKA_GROUP_STREAMS_MIN_SESSION_TIMEOUT_MS, value: "6000"}
            - {name: KAFKA_GROUP_STREAMS_HEARTBEAT_INTERVAL_MS, value: {{ .Values.kafka.groupHeartbeatIntervalMs | quote }}}
            - {name: KAFKA_GROUP_STREAMS_MIN_HEARTBEAT_INTERVAL_MS, value: {{ .Values.kafka.groupHeartbeatIntervalMs | quote }}}
            - {name: KAFKA_GROUP_STREAMS_MAX_STANDBY_REPLICAS, value: "2"}
            - {name: KAFKA_GROUP_STREAMS_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            {{- range $k, $v := .Values.kafka.extraEnv }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          readinessProbe:
            tcpSocket: {port: 9092}
            periodSeconds: 5
          resources: {{- toYaml .Values.kafka.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
