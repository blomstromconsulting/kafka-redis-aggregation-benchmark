# Shared downstream services, identical for every variant: persistence service (PostgreSQL) and ML simulator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persistence-service
  labels: {{- include "bench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.persistence.replicas }}
  selector:
    matchLabels: {app: persistence-service}
  template:
    metadata:
      labels:
        app: persistence-service
        {{- include "bench.labels" . | nindent 8 }}
      annotations: {{- include "bench.metricsAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: persistence-service
          image: "{{ .Values.images.registry }}/persistence-service:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            {{- include "bench.dbEnv" . | nindent 12 }}
            - {name: JAVA_OPTS, value: {{ .Values.jvmOpts | quote }}}
            - {name: JSON_LOGS, value: {{ .Values.jsonLogs | quote }}}
            - {name: DB_POOL_SIZE, value: {{ .Values.persistence.dbPoolSize | quote }}}
            - {name: PERSISTENCE_LATENCY_MS, value: {{ .Values.persistence.faults.latencyMs | quote }}}
            - {name: PERSISTENCE_LATENCY_JITTER_MS, value: {{ .Values.persistence.faults.latencyJitterMs | quote }}}
            - {name: PERSISTENCE_ERROR_BEFORE_RATE, value: {{ .Values.persistence.faults.errorBeforeRate | quote }}}
            - {name: PERSISTENCE_ERROR_AFTER_COMMIT_RATE, value: {{ .Values.persistence.faults.errorAfterCommitRate | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /q/health/ready, port: 8080}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /q/health/live, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources: {{- toYaml .Values.persistence.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: persistence-service
  labels: {{- include "bench.labels" . | nindent 4 }}
spec:
  selector: {app: persistence-service}
  ports:
    - {name: http, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-simulator
  labels: {{- include "bench.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ml.replicas }}
  selector:
    matchLabels: {app: ml-simulator}
  template:
    metadata:
      labels:
        app: ml-simulator
        {{- include "bench.labels" . | nindent 8 }}
      annotations: {{- include "bench.metricsAnnotations" . | nindent 8 }}
    spec:
      containers:
        - name: ml-simulator
          image: "{{ .Values.images.registry }}/ml-simulator:{{ .Values.images.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - {name: JAVA_OPTS, value: {{ .Values.jvmOpts | quote }}}
            - {name: JSON_LOGS, value: {{ .Values.jsonLogs | quote }}}
            - {name: ML_PROFILE, value: {{ .Values.ml.profile | quote }}}
            - {name: ML_LATENCY_MS, value: {{ .Values.ml.latencyMs | quote }}}
            - {name: ML_STDDEV_MS, value: {{ .Values.ml.stddevMs | quote }}}
            - {name: ML_TAIL_PROBABILITY, value: {{ .Values.ml.tailProbability | quote }}}
            - {name: ML_TAIL_LATENCY_MS, value: {{ .Values.ml.tailLatencyMs | quote }}}
            - {name: ML_ERROR_RATE, value: {{ .Values.ml.errorRate | quote }}}
            - {name: ML_MAX_CONCURRENCY, value: {{ .Values.ml.maxConcurrency | quote }}}
            - {name: ML_MAX_QUEUE, value: {{ .Values.ml.maxQueue | quote }}}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /v2/health/ready, port: 8080}
            periodSeconds: 3
          resources: {{- toYaml .Values.ml.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ml-simulator
  labels: {{- include "bench.labels" . | nindent 4 }}
spec:
  selector: {app: ml-simulator}
  ports:
    - {name: http, port: 8080}
