# Native executable only. Lettuce picks its address resolver group (Netty's DNS resolver when netty-resolver-dns is on
# the classpath, as it is with Quarkus) in static initializers; that object must be created at run time.
Args = --initialize-at-run-time=io.lettuce.core.resource.DefaultClientResources,io.lettuce.core.resource.AddressResolverGroupProvider,io.lettuce.core.resource.AddressResolverGroupProvider$DefaultDnsAddressResolverGroupWrapper
