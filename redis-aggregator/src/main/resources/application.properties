# Redis aggregator (variant B). Every bench.* value is overridden by environment variables from Helm.
quarkus.application.name=redis-aggregator
quarkus.http.port=8080
quarkus.shutdown.timeout=40s
quarkus.banner.enabled=false
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."io.lettuce".level=WARN
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics

bench.run-id=${RUN_ID:local}
bench.variant=${VARIANT:b}
bench.pod=${POD_NAME:local}
bench.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
bench.ingress-topic=${INGRESS_TOPIC:aggbench.local.ingress}

bench.consumer.group-id=${GROUP_ID:aggbench-b-local}
bench.consumer.group-protocol=${GROUP_PROTOCOL:consumer}
bench.consumer.max-poll-records=${MAX_POLL_RECORDS:500}
bench.consumer.session-timeout-ms=${SESSION_TIMEOUT_MS:10000}
bench.consumer.heartbeat-interval-ms=${HEARTBEAT_INTERVAL_MS:1000}
bench.consumer.max-in-flight-actions=${MAX_INFLIGHT_ACTIONS:20000}

bench.redis.uri=${REDIS_URI:redis://localhost:6379}
bench.redis.replay-window=${REDIS_REPLAY_WINDOW:60s}

bench.aggregation.completed-retention=${COMPLETED_RETENTION:120s}
bench.aggregation.incomplete-ttl=${INCOMPLETE_TTL:600s}

bench.executor.persistence-url=${PERSISTENCE_URL:http://localhost:8081}
bench.executor.inference-url=${INFERENCE_URL:http://localhost:8082}
bench.executor.max-batch-size=${EXECUTOR_MAX_BATCH:200}
bench.executor.max-concurrent-batches=${EXECUTOR_CONCURRENT_BATCHES:4}
bench.executor.max-in-flight-inference=${EXECUTOR_MAX_INFERENCE:256}
