# Kafka Streams aggregator (A1 and A2). Every bench.* value is overridden by environment variables from Helm.
quarkus.application.name=streams-aggregator
quarkus.http.port=8080
quarkus.shutdown.timeout=40s
quarkus.banner.enabled=false
quarkus.log.console.json.enabled=${JSON_LOGS:false}
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."org.apache.kafka.streams.KafkaStreams".level=INFO
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.system=true
quarkus.micrometer.export.prometheus.path=/q/metrics

bench.run-id=${RUN_ID:local}
bench.variant=${VARIANT:a1}
bench.pod=${POD_NAME:local}
bench.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
bench.ingress-topic=${INGRESS_TOPIC:aggbench.local.ingress}
bench.actions-topic=${ACTIONS_TOPIC:aggbench.local.actions}

bench.streams.application-id=${APPLICATION_ID:aggbench-a1-local}
bench.streams.group-protocol=${GROUP_PROTOCOL:streams}
bench.streams.num-standby-replicas=${NUM_STANDBY_REPLICAS:1}
bench.streams.processing-guarantee=${PROCESSING_GUARANTEE:exactly_once_v2}
bench.streams.commit-interval-ms=${COMMIT_INTERVAL_MS:100}
bench.streams.state-dir=${STATE_DIR:/var/lib/kafka-streams}
bench.streams.replication-factor=${REPLICATION_FACTOR:1}
bench.streams.session-timeout-ms=${SESSION_TIMEOUT_MS:10000}
bench.streams.heartbeat-interval-ms=${HEARTBEAT_INTERVAL_MS:1000}
bench.streams.max-poll-records=${MAX_POLL_RECORDS:500}

bench.aggregation.completed-retention=${COMPLETED_RETENTION:120s}
bench.aggregation.incomplete-ttl=${INCOMPLETE_TTL:600s}

bench.executor.persistence-url=${PERSISTENCE_URL:http://localhost:8081}
bench.executor.inference-url=${INFERENCE_URL:http://localhost:8082}
bench.executor.max-batch-size=${EXECUTOR_MAX_BATCH:200}
bench.executor.max-concurrent-batches=${EXECUTOR_CONCURRENT_BATCHES:4}
bench.executor.max-in-flight-inference=${EXECUTOR_MAX_INFERENCE:256}

bench.intent-consumer.max-in-flight-actions=${MAX_INFLIGHT_ACTIONS:20000}
